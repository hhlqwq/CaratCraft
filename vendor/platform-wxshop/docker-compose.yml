services:
  mysql:
    image: mysql:8.0.36
    container_name: platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:REDACTED_CREDENTIAL}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-platform}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./_sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  platform-admin:
    image: carat-craft-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: platform-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: ${PLATFORM_ADMIN_JAVA_OPTS:--Xms256m -Xmx512m}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-platform}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:REDACTED_CREDENTIAL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WX_MINIAPP_APPID: ${WX_MINIAPP_APPID:-}
      WX_MINIAPP_SECRET: ${WX_MINIAPP_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
    command:
      - sh
      - -c
      - java $$JAVA_OPTS -jar /app/platform-admin.jar
    healthcheck:
      # JVM 默认监听 IPv6, 同时检查 IPv4/IPv6 表且不依赖 Bash / Checks IPv4 and IPv6 without bash dependency.
      test: ["CMD-SHELL", "grep -q ':1F90 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  platform-api:
    image: carat-craft-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: platform-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: ${PLATFORM_API_JAVA_OPTS:--Xms256m -Xmx512m}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-platform}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:REDACTED_CREDENTIAL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WX_MINIAPP_APPID: ${WX_MINIAPP_APPID:-}
      WX_MINIAPP_SECRET: ${WX_MINIAPP_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
    command:
      - sh
      - -c
      - java $$JAVA_OPTS -jar /app/platform-api.jar
    healthcheck:
      # JVM 默认监听 IPv6, 同时检查 IPv4/IPv6 表且不依赖 Bash / Checks IPv4 and IPv6 without bash dependency.
      test: ["CMD-SHELL", "grep -q ':1F91 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  nginx:
    image: carat-craft-admin-ui:local
    build:
      context: .
      dockerfile: Dockerfile.admin-ui
    container_name: platform-nginx
    restart: unless-stopped
    depends_on:
      platform-admin:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8888}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql-data:
  redis-data:
