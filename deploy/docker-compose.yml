name: platform-wxshop

x-application-environment: &application-environment
  TZ: ${TZ:-Asia/Shanghai}
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_DATABASE: ${MYSQL_DATABASE:-platform}
  MYSQL_USERNAME: ${MYSQL_APP_USER:-caratcraft}
  MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:-}
  APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
  WX_MINIAPP_APPID: ${WX_MINIAPP_APPID:-}
  WX_MINIAPP_SECRET: ${WX_MINIAPP_SECRET:-}
  WX_MINIAPP_TOKEN: ${WX_MINIAPP_TOKEN:-}
  WX_MINIAPP_AESKEY: ${WX_MINIAPP_AESKEY:-}
  WX_MP_APPID: ${WX_MP_APPID:-}
  WX_MP_SECRET: ${WX_MP_SECRET:-}
  WX_MP_TOKEN: ${WX_MP_TOKEN:-}
  WX_MP_AESKEY: ${WX_MP_AESKEY:-}
  WX_PAY_APPID: ${WX_PAY_APPID:-}
  WX_PAY_MCH_ID: ${WX_PAY_MCH_ID:-}
  WX_PAY_MCH_KEY: ${WX_PAY_MCH_KEY:-}
  WX_PAY_KEY_PATH: /run/secrets/apiclient_cert.p12
  WX_PAY_NOTIFY_URL: ${WX_PAY_NOTIFY_URL:-}
  WX_PAY_NOTIFY_IP_WHITELIST_ENABLED: ${WX_PAY_NOTIFY_IP_WHITELIST_ENABLED:-true}
  WX_PAY_NOTIFY_IP_WHITELIST: ${WX_PAY_NOTIFY_IP_WHITELIST:-}
  ALI_PAY_NOTIFY_URL: ${ALI_PAY_NOTIFY_URL:-}

services:
  mysql:
    image: mysql:8.0.36
    container_name: platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-platform}
      MYSQL_USER: ${MYSQL_APP_USER:-caratcraft}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/init:/docker-entrypoint-initdb.d:ro
      - ../database/legacy:/opt/caratcraft/legacy:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: platform-redis
    user: redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        test "$${#REDIS_PASSWORD}" -ge 24 || exit 1;
        case "$$REDIS_PASSWORD" in *[!a-zA-Z0-9+/=_-]*) exit 1;; esac;
        umask 077;
        printf "appendonly yes\nrequirepass \"%s\"\n" "$$REDIS_PASSWORD" > /data/.redis-private.conf;
        exec redis-server /data/.redis-private.conf
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  platform-admin:
    image: carat-craft-backend:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        BUILD_REVISION: ${BUILD_REVISION:-workspace}
    container_name: platform-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *application-environment
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: ${PLATFORM_ADMIN_JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - upload-data:/data/uploads
      - ./secrets:/run/secrets:ro
    command:
      - sh
      - -c
      - java $$JAVA_OPTS -jar /app/platform-admin.jar
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/healthcheck", "HealthCheck", "http://127.0.0.1:8080/platform-framework/internal/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  platform-api:
    image: carat-craft-backend:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        BUILD_REVISION: ${BUILD_REVISION:-workspace}
    container_name: platform-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *application-environment
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: ${PLATFORM_API_JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - upload-data:/data/uploads
      - ./secrets:/run/secrets:ro
    command:
      - sh
      - -c
      - java $$JAVA_OPTS -jar /app/platform-api.jar
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/healthcheck", "HealthCheck", "http://127.0.0.1:8081/platform-framework-api/internal/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  nginx:
    image: carat-craft-admin-ui:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin-ui
      args:
        BUILD_REVISION: ${BUILD_REVISION:-workspace}
    container_name: platform-nginx
    restart: unless-stopped
    depends_on:
      platform-admin:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8888}:80"
    volumes:
      - upload-data:/usr/share/nginx/html/upload:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql-data:
  redis-data:
  upload-data:
